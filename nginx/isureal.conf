# アプリへの接続を使い回す。proxy_http_version 1.1 と空の Connection ヘッダーが揃わないと使い回されない。
# location で proxy_set_header を1つでも書くと server の proxy_set_header は引き継がれないので、Connection は各 location に書く。
upstream isureal_app {
  server 127.0.0.1:8080;
  keepalive 64;
}

server {
  listen 80 default_server;

  proxy_http_version 1.1;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # 画像。アプリ（Go）が署名・期限・削除状態を毎回検証する。
  # X-Image-Accel: 1 を付けて転送すると、アプリは初期データの画像について、データを DB から読まず、
  # X-Accel-Redirect: /_images/<id> を返す（それ以外の画像は、従来どおりアプリが DB から返す）。
  location ~ ^/api/images/[^/]+$ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Image-Accel 1;
    proxy_pass http://isureal_app;
  }

  # 初期データの画像のデータ。X-Accel-Redirect 専用（外部からの直接アクセスは 404）。
  # 画像置き場のファイルがあるサーバー（isu1）では、ローカルのファイルをそのまま返す。
  # isu2 / isu3 にはファイルがなく、アプリが X-Accel-Redirect を返さない（DB から返す）ので、ここには来ない。
  # ファイルが無いときは @image_from_db（DB 経由）に回す。
  location ~ "^/_images/(?<p>[0-9a-f]{2})(?<rest>[0-9a-f-]{34})$" {
    internal;
    root /var/lib/isureal-images;
    default_type image/jpeg;
    etag off;
    max_ranges 0;
    try_files /$p/$p$rest @image_from_db;
  }

  # ローカルにファイルがなかった場合の予備。アプリの内部エンドポイント（loopback 限定）が DB から返す。
  location @image_from_db {
    internal;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_pass http://isureal_app/_internal/image-data/$p$rest;
    proxy_hide_header Cache-Control;
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # クライアントが X-Image-Accel を付けて画像以外のエンドポイントに送っても、アプリには渡さない
    proxy_set_header X-Image-Accel "";
    proxy_pass http://isureal_app;
  }

  location / {
    try_files $uri /index.html;
  }
}
