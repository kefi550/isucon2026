server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # 画像。アプリ（Go）が署名・期限・削除状態を毎回検証する。
  # X-Image-Accel: 1 を付けて転送すると、アプリは初期データの画像について、データを DB から読まず、
  # X-Accel-Redirect: /_images/<id> を返す（それ以外の画像は、従来どおりアプリが DB から返す）。
  location ~ ^/api/images/[^/]+$ {
    proxy_set_header Host $host;
    proxy_set_header X-Image-Accel 1;
    proxy_pass http://127.0.0.1:8080;
  }

  # 初期データの画像のデータ。X-Accel-Redirect 専用（外部からの直接アクセスは 404）。
  # asia2 の画像置き場（ファイル）から返す。置き場にない・応答がない場合は、@image_from_db（DB 経由）に回す。
  location ~ "^/_images/(?<image_id>[0-9a-f-]{36})$" {
    internal;
    proxy_pass http://isureal_image_store/$image_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @image_from_db;
    # 1つ目の応答（X-Accel-Redirect を返した方）の Cache-Control: no-store を nginx が引き継ぐ。こちらを隠さないと2つになる。
    proxy_hide_header Cache-Control;
    # 従来のアプリの応答にはない、キャッシュ用のヘッダーは出さない
    proxy_hide_header ETag;
    proxy_hide_header Last-Modified;
    proxy_hide_header Accept-Ranges;
  }

  # 画像置き場にファイルがなかった場合の予備。アプリの内部エンドポイント（loopback 限定）が DB から返す。
  location @image_from_db {
    internal;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8080/_internal/image-data/$image_id;
    proxy_hide_header Cache-Control;
  }

  location /api/ {
    proxy_set_header Host $host;
    # クライアントが X-Image-Accel を付けて画像以外のエンドポイントに送っても、アプリには渡さない
    proxy_set_header X-Image-Accel "";
    proxy_pass http://127.0.0.1:8080;
  }

  location / {
    try_files $uri /index.html;
  }
}
