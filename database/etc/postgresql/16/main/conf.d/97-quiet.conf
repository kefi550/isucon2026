# 計測・ログ・統計の収集を止めて、クエリの処理に集中させる。
# 以下は reload で反映できる。pg_stat_statements と auto_explain は、
# 91-pgss.conf を消した上での restart で外れる（shared_preload_libraries が空になる）。
# 計測を戻すときは、このファイルを消して、91-pgss.conf（git の履歴にある）を戻し restart する。

# ロック待ちのログ（deadlock_timeout は既定の 1s に戻す）
log_lock_waits = off
deadlock_timeout = 1s
# チェックポイントのログ
log_checkpoints = off
# クエリごとのプロセス名の書き換え
update_process_title = off
# 統計情報の取得時のキャッシュ（スナップショット）
stats_fetch_consistency = none
# 実行中のクエリの追跡（pg_stat_activity が空になる）
track_activities = off
# IO 時間の計測
track_io_timing = off

# ログに残るのは、クライアント切断（LOG: could not receive data from client）と、アプリ側の想定内のエラー
# （ユーザー名の重複など、ERROR とその STATEMENT）だけ。サーバーログの重さの順は ... < ERROR < LOG < FATAL なので、
# fatal にすると ERROR と LOG が出なくなる。FATAL（接続の失敗など）と PANIC は残る。
log_min_messages = fatal
log_min_error_statement = fatal
log_error_verbosity = terse
