# 投稿の画像 INSERT（1回約0.5MB）のたびに、接続側のプロセスが自分で古いページをディスクへ書き出していた
# （pg_stat_statements の shared_blks_written が、画像の INSERT だけで1走行あたり約570MB）。
# bgwriter に先回りして空きページを作らせ、INSERT がその場で書き出しを待たないようにする。
# 書き込みの総量と耐久性は変わらない。再起動は不要で、設定の再読み込み（pg_reload_conf）で反映される。
bgwriter_delay = 10ms             # 既定 200ms。起きる間隔を短くする
bgwriter_lru_maxpages = 1000      # 既定 100。1回に書き出せるページ数を増やす
bgwriter_lru_multiplier = 10.0    # 既定 2.0。この先必要になる空きページを多めに見積もる
