# 速さ優先の設定（reload だけで反映できるものだけ）。不要になったらこのファイルを消して reload。

# --- WAL・チェックポイント ---
# ベンチ中に WAL の量で強制チェックポイントが始まらないようにする（最終日の直前に始まっていた）
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9
# チェックポイント直後の全ページ書き出し（FPI）を圧縮して WAL の量を減らす
wal_compression = on
# コミットごとの WAL の fsync 待ちをなくす。クラッシュ時に直近 約0.6秒のコミットを失いうるが、
# クリーンな停止・再起動ではデータは失われない
synchronous_commit = off

# --- プラン・IO ---
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off
work_mem = 16MB
