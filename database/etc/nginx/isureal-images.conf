# 初期データの画像（ファイル）を配信する専用の nginx。asia2 で isureal-images.service として動かす。
# 既存の nginx.service や sites-enabled とは別に、この設定ファイルだけで起動する（nginx -c で指定）。
# 各サーバーの nginx（isureal.conf の /_images/）が、アプリの検証を通ったあとに、ここから取りに来る。
# ファイルは /var/lib/isureal-images/<idの先頭2文字>/<id>（webapp/go/cmd/imgexport が書き出す）。
user www-data;
worker_processes 2;
pid /run/isureal-images.pid;
error_log /var/log/nginx/isureal-images-error.log warn;

events {
  worker_connections 1024;
}

http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  keepalive_requests 10000;

  # 画像は JPEG のみ（初期データの media_type はすべて image/jpeg）
  default_type image/jpeg;
  etag off;

  server {
    listen 8081;
    server_name _;
    root /var/lib/isureal-images;

    # /<id> を /<idの先頭2文字>/<id> に対応づける。読み出し専用（GET / HEAD のみ）
    location ~ "^/(?<p>[0-9a-f]{2})(?<rest>[0-9a-f-]{34})$" {
      limit_except GET HEAD {
        deny all;
      }
      try_files /$p/$p$rest =404;
    }

    location / {
      return 404;
    }
  }
}
